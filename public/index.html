<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bantha Tracker</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<header class="app-header"><div class="brand-lockup"><div class="bantha-mark" aria-hidden="true"><svg viewBox="0 0 120 80"><path d="M19 48c-10-7-14-18-11-31 10 5 18 11 24 20M101 48c10-7 14-18 11-31-10 5-18 11-24 20" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><path d="M31 39c6-13 17-20 29-20s23 7 29 20l-8 24c-6 8-13 12-21 12s-15-4-21-12z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><path d="M47 48h1M72 48h1M50 62c7 5 13 5 20 0" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg></div><div><div class="logo">BANTHA <span>TRACKER</span></div><div class="tag">Collect • Track • Buy • Resell</div></div></div></header>
<section id="auth" class="card">
<h2>Sign in / Create account</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (8+ characters)">
<div><button onclick="login()">Sign in</button><button class="secondary" onclick="register()">Create account</button></div><p id="msg"></p></section>
<section id="app" hidden>
<div class="bar"><h2>My Inventory</h2><button class="secondary" onclick="logout()">Sign out</button></div>
<div class="card"><h3>Add Figure</h3><input id="name" placeholder="Figure name"><textarea id="description" placeholder="Description / variant / condition"></textarea>
<div class="grid"><input id="buy" type="number" step=".01" placeholder="Recommended buy $"><input id="retail" type="number" step=".01" placeholder="Recommended retail $"></div>
<button onclick="addFigure()">Add figure</button></div>
<div id="figures"></div></section>
</main><script src="/app.js"></script></body></html>
